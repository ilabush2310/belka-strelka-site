/* Шапка */

  min-height:52px;transition:background .2s,border-color .2s,color .2s,transform .15s}

/* Текстовые варианты */

.opt-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);
  flex-shrink:0;position:relative}
.opt[aria-pressed="true"] .opt-dot{border-color:var(--accent-deep)}
.opt[aria-pressed="true"] .opt-dot::after{content:"";position:absolute;inset:3px;
  border-radius:50%;background:var(--accent-deep)}

/* Визуальные варианты — фото работ студии */
.opts-visual{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

<script>
(function(){
"use strict";

/* ============================================================
   ФОТО РАБОТ СТУДИИ
   Реальные работы, не сток. Подписи — как называет их мастер.
   ============================================================ */
var PHOTOS = {
  classic: {src:"img/quiz/classic.webp",  label:"Классика"},
  "2d":    {src:"img/quiz/2d.webp",       label:"2D объём"},
  thin:    {src:"img/quiz/2d_thin.webp",  label:"2D тонкими ресницами"},
  "3d":    {src:"img/quiz/3d.webp",       label:"3D объём"},
  mega:    {src:"img/quiz/mega.webp",     label:"Мега-объём"},
  rays:    {src:"img/quiz/rays.webp",     label:"1,5D с лучами"},
  wet:     {src:"img/quiz/wet.webp",      label:"Мокрый эффект"},
  anime:   {src:"img/quiz/anime.webp",    label:"Аниме-эффект"},
  trend:   {src:"img/quiz/trend.webp",    label:"Трендовое"}
};

/* ============================================================
   ВОПРОСЫ
   Правятся без знания кода. Не меняйте id вариантов —
   они связаны с таблицей баллов ниже.
   ============================================================ */
var QUESTIONS = [
  { id:"result", title:"Какие ресницы хочется увидеть в зеркале?",
    hint:"Выберите то, что ближе по ощущению — точный объём подберёт мастер.",
    options:[
      ["natural","Как мои, только лучше"],
      ["open","Открытый, выразительный взгляд"],
      ["visible","Заметные ресницы"],
      ["bright","Яркий, эффектный результат"]
    ]},
  { id:"makeup", title:"Как вы обычно красите глаза?",
    hint:"Это подсказывает, к какой яркости вы привыкли.",
    options:[
      ["none","Почти не крашусь"],
      ["mascara","Только тушь"],
      ["liner","Люблю стрелки"],
      ["full","Полный макияж"],
      ["varies","По настроению"]
    ]},
  { id:"style", title:"Какой вариант нравится больше?",
    hint:"Это реальные работы студии. Выбирайте глазами, а не по названию.",
    visual:true,
    options:[
      ["classic","classic"],["2d","2d"],["thin","thin"],
      ["rays","rays"],["wet","wet"],["3d","3d"],
      ["mega","mega"],["anime","anime"],["trend","trend"]
    ]},
  { id:"experience", title:"Наращивали раньше?",
    hint:"",
    options:[
      ["never","Никогда"],
      ["classic","Делала классику"],
      ["volume","Делала объём"],
      ["regular","Постоянно ношу"],
      ["change","Хочу сменить привычный образ"]
    ]},
  { id:"color", title:"Как относитесь к цвету?",
    hint:"",
    options:[
      ["black","Только чёрные"],
      ["brown","Хочу что-то мягче"],
      ["colored","Интересно попробовать цвет"],
      ["master","Пусть мастер решит"]
    ]},
  { id:"priority", title:"Что для вас важнее всего?",
    hint:"",
    options:[
      ["nature","Естественность"],
      ["expressive","Выразительность"],
      ["durability","Стойкость и носка"],
      ["nomakeup","Просыпаться без макияжа"],
      ["new","Попробовать новое"]
    ]}
];

/* ============================================================
   SCORING
   Не «ответ = услуга», а профиль по нескольким характеристикам.
   Каждый ответ добавляет баллы сразу нескольким осям.
   ============================================================ */
var WEIGHTS = {
  result: {
    natural:{nature:4,expr:0,volume:0,bright:0,trend:0},
    open:   {nature:2,expr:3,volume:1,bright:0,trend:0},
    visible:{nature:0,expr:3,volume:3,bright:2,trend:0},
    bright: {nature:0,expr:2,volume:4,bright:4,trend:2}
  },
  makeup: {
    none:   {nature:3,expr:0,volume:0,bright:0,trend:0},
    mascara:{nature:2,expr:1,volume:0,bright:0,trend:0},
    liner:  {nature:0,expr:3,volume:1,bright:1,trend:1},
    full:   {nature:0,expr:2,volume:3,bright:3,trend:1},
    varies: {nature:1,expr:1,volume:1,bright:1,trend:1}
  },
  style: {
    classic:{nature:4,expr:1,volume:0,bright:0,trend:0},
    "2d":   {nature:2,expr:3,volume:2,bright:0,trend:0},
    thin:   {nature:3,expr:2,volume:1,bright:0,trend:0},
    rays:   {nature:1,expr:2,volume:1,bright:1,trend:3},
    wet:    {nature:1,expr:3,volume:2,bright:1,trend:3},
    "3d":   {nature:0,expr:3,volume:3,bright:2,trend:1},
    mega:   {nature:0,expr:2,volume:4,bright:4,trend:1},
    anime:  {nature:0,expr:2,volume:2,bright:3,trend:4},
    trend:  {nature:0,expr:2,volume:2,bright:3,trend:4}
  },
  experience: {
    never:  {nature:2,expr:0,volume:0,bright:0,trend:0},
    classic:{nature:1,expr:1,volume:1,bright:0,trend:0},
    volume: {nature:0,expr:1,volume:2,bright:1,trend:1},
    regular:{nature:0,expr:1,volume:2,bright:1,trend:1},
    change: {nature:0,expr:1,volume:1,bright:2,trend:3}
  },
  color: {
    black:  {nature:1,expr:1,volume:0,bright:0,trend:0},
    brown:  {nature:3,expr:0,volume:0,bright:0,trend:0},
    colored:{nature:0,expr:1,volume:0,bright:3,trend:4},
    master: {nature:1,expr:1,volume:0,bright:0,trend:0}
  },
  priority: {
    nature:    {nature:4,expr:0,volume:0,bright:0,trend:0},
    expressive:{nature:0,expr:4,volume:2,bright:1,trend:0},
    durability:{nature:1,expr:1,volume:1,bright:0,trend:0},
    nomakeup:  {nature:1,expr:3,volume:2,bright:1,trend:0},
    new:       {nature:0,expr:1,volume:1,bright:2,trend:4}
  }
};

/* Профили результатов. Каждый — набор целевых характеристик. */
var PROFILES = [
  { key:"natural", title:"Натуральный",
    badge:"Ваш стиль",
    why:["хочется, чтобы взгляд стал свежее, но без «эффекта нарощенных»",
         "привычный макияж — минимальный",
         "важно, чтобы ресницы не ощущались"],
    main:"Классика", alt:"1,5D или 2D тонкими ресницами", more:"Мягкий 2D",
    photos:["classic","thin","2d"],
    target:{nature:1.0,expr:0.3,volume:0.1,bright:0.0,trend:0.0} },

  { key:"soft", title:"Натурально-выразительный",
    badge:"Ваш стиль",
    why:["хочется выразительности, но без тяжести",
         "нравится, когда ресницы выглядят «своими, только гуще»",
         "утром можно почти не краситься"],
    main:"2D объём", alt:"Классика или 2D тонкими ресницами", more:"3D или мокрый эффект",
    photos:["2d","thin","wet"],
    target:{nature:0.6,expr:0.9,volume:0.4,bright:0.1,trend:0.1} },

  { key:"expressive", title:"Выразительный",
    badge:"Ваш стиль",
    why:["нравится, когда ресницы заметны",
         "привычный макияж довольно активный",
         "хочется, чтобы взгляд читался без туши"],
    main:"3D объём", alt:"2D объём или мокрый эффект", more:"4D или лучи",
    photos:["3d","wet","2d"],
    target:{nature:0.2,expr:1.0,volume:0.8,bright:0.5,trend:0.2} },

  { key:"bright", title:"Яркий",
    badge:"Ваш стиль",
    why:["нравится заметный, эффектный результат",
         "не боитесь выразительных ресниц",
         "хочется, чтобы взгляд был акцентом"],
    main:"4D или мега-объём", alt:"3D объём", more:"Трендовые эффекты и цветные акценты",
    photos:["mega","3d","anime"],
    target:{nature:0.0,expr:0.7,volume:1.0,bright:1.0,trend:0.4} },

  { key:"trend", title:"Трендовый",
    badge:"Ваш стиль",
    why:["интересны необычные схемы, а не просто густота",
         "хочется попробовать то, чего ещё не делали",
         "нравится, когда эффект узнаваемый"],
    main:"Лучи, мокрый эффект или аниме", alt:"3D объём", more:"Цветные акценты",
    photos:["rays","anime","trend"],
    target:{nature:0.1,expr:0.7,volume:0.5,bright:0.6,trend:1.0} }
];

var AXES = ["nature","expr","volume","bright","trend"];

function computeProfile(answers){
  var raw = {nature:0,expr:0,volume:0,bright:0,trend:0};
  var max = {nature:0,expr:0,volume:0,bright:0,trend:0};
  QUESTIONS.forEach(function(q){
    var table = WEIGHTS[q.id]; if(!table) return;
    // максимум по этому вопросу — чтобы нормировать в 0..100
    var best = {nature:0,expr:0,volume:0,bright:0,trend:0};
    Object.keys(table).forEach(function(opt){
      AXES.forEach(function(a){ if(table[opt][a] > best[a]) best[a] = table[opt][a]; });
    });
    AXES.forEach(function(a){ max[a] += best[a]; });
    var ans = answers[q.id];
    if(ans && table[ans]) AXES.forEach(function(a){ raw[a] += table[ans][a]; });
  });
  var norm = {};
  AXES.forEach(function(a){ norm[a] = max[a] ? raw[a]/max[a] : 0; });
  return norm;
}

function pickProfile(norm){
  // Ближайший профиль по евклидову расстоянию в пространстве характеристик.
  var best=null, bestD=Infinity, second=null, secondD=Infinity;
  PROFILES.forEach(function(p){
    var d=0;
    AXES.forEach(function(a){ var diff = norm[a]-p.target[a]; d += diff*diff; });
    d=Math.sqrt(d);
    if(d<bestD){ second=best; secondD=bestD; best=p; bestD=d; }
    else if(d<secondD){ second=p; secondD=d; }
  });
  // Если два профиля почти равны — честно говорим, что вы между ними.
  return {profile:best, runnerUp:second, borderline:(secondD-bestD)<0.12};
}

/* ============================================================
   АНАЛИТИКА
   Своей системы на сайте нет, поэтому пишем в localStorage
   и дублируем в Яндекс.Метрику, если она будет подключена.
   ============================================================ */
function track(event, payload){
  try{
    var log = JSON.parse(localStorage.getItem("bs_quiz_events") || "[]");
    log.push({e:event, p:payload||null, t:Date.now()});
    localStorage.setItem("bs_quiz_events", JSON.stringify(log.slice(-300)));
  }catch(err){}
  if(typeof window.ym === "function" && window.__ymId){
    window.ym(window.__ymId, "reachGoal", event, payload || {});
  }
}

/* ============================================================
   ЛОГИКА ЭКРАНОВ
   ============================================================ */
var answers = {}, step = 0;
var el = {
  intro:document.getElementById("intro"),
  quiz:document.getElementById("quiz"),
  result:document.getElementById("result"),
  qtitle:document.getElementById("qtitle"),
  qhint:document.getElementById("qhint"),
  qopts:document.getElementById("qopts"),
  pcount:document.getElementById("pcount"),
  ppct:document.getElementById("ppct"),
  pbar:document.getElementById("pbar")
};

function show(name){
  ["intro","quiz","result"].forEach(function(k){ el[k].hidden = (k!==name); });
}

function renderQuestion(){
  var q = QUESTIONS[step];
  el.qtitle.textContent = q.title;
  el.qhint.textContent = q.hint || "";
  el.qhint.style.display = q.hint ? "" : "none";

  var pct = Math.round((step)/QUESTIONS.length*100);
  el.pcount.textContent = "Вопрос " + (step+1) + " из " + QUESTIONS.length;
  el.ppct.textContent = pct + "%";
  el.pbar.style.width = pct + "%";

  el.qopts.className = q.visual ? "opts-visual" : "opts";
  el.qopts.innerHTML = "";

  q.options.forEach(function(pair){
    var value = pair[0], labelOrPhoto = pair[1];
    var btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-pressed", answers[q.id]===value ? "true":"false");

    if(q.visual){
      var ph = PHOTOS[labelOrPhoto];
      btn.className = "vopt";
      btn.innerHTML =
        '<img src="'+ph.src+'" alt="Работа студии: '+ph.label+'" loading="lazy" width="640" height="640">' +
        '<span>'+ph.label+'</span>';
      btn.setAttribute("aria-label", "Выбрать вариант: " + ph.label);
    } else {
      btn.className = "opt";
      btn.innerHTML = '<span class="opt-dot" aria-hidden="true"></span><span>'+labelOrPhoto+'</span>';
    }

    btn.addEventListener("click", function(){
      answers[q.id] = value;
      track("quiz_question_answered", {question:q.id, answer:value, step:step+1});
      step++;
      if(step >= QUESTIONS.length) renderResult();
      else { renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
    el.qopts.appendChild(btn);
  });

  document.getElementById("back").disabled = (step===0);
  document.getElementById("back").style.opacity = step===0 ? ".45" : "";
}

function renderResult(){
  var norm = computeProfile(answers);
  var picked = pickProfile(norm);
  var p = picked.profile;

  track("quiz_completed", {profile:p.key});
  track("quiz_result_viewed", {profile:p.key});

  document.getElementById("rbadge").textContent = p.badge;
  document.getElementById("rtitle").textContent = p.title + " образ";

  var why = document.getElementById("rwhy");
  why.innerHTML = "<p style='margin:0 0 10px'>По вашим ответам:</p><ul style='margin:0;padding-left:20px'>" +
    p.why.map(function(w){ return "<li>"+w+"</li>"; }).join("") + "</ul>";

  var rec = document.getElementById("rrec");
  var rows = [
    ["Основной вариант", p.main],
    ["Также можно попробовать", p.alt],
    ["Если захочется ярче", p.more]
  ];
  if(picked.borderline){
    rows.splice(1,0,["Вы между двумя стилями", picked.runnerUp.title + " — тоже подойдёт"]);
  }
  rec.innerHTML = rows.map(function(r){
    return '<div class="rec-row"><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>';
  }).join("");

  // Дополнительные заметки: цвет, LED, новичок
  var notes = [];
  if(answers.color === "colored")
    notes.push("Раз интересен цвет — можно вплести цветные реснички, они смотрятся мягче, чем кажется.");
  if(answers.color === "brown")
    notes.push("Коричневые ресницы дадут более мягкий переход, чем чёрные.");
  if(answers.experience === "never")
    notes.push("Раз наращивание впервые — спокойнее начать с более лёгкого варианта. Добавить объём в следующий раз всегда успеется.");
  // LED показываем не всем: только при запросе на стойкость или интересе к новому
  if(answers.priority === "durability" || answers.priority === "new" || norm.trend > 0.55){
    notes.push("Ещё один вариант, который можно рассмотреть — LED-наращивание. Это отдельная технология, её делает Маргарита. Расскажем подробнее, если интересно.");
    track("recommendation_led");
  }
  document.getElementById("rnotes").innerHTML = notes.map(function(n){
    return '<div class="note">'+n+'</div>';
  }).join("");

  var gal = document.getElementById("rgallery");
  gal.innerHTML = p.photos.map(function(k){
    var ph = PHOTOS[k];
    return '<figure><img src="'+ph.src+'" alt="Работа студии: '+ph.label+'" loading="lazy" width="640" height="640">' +
           '<figcaption>'+ph.label+'</figcaption></figure>';
  }).join("");

  document.getElementById("rdisc").textContent =
    "Точный объём, длину, изгиб и схему мастер определит уже по вашим натуральным ресницам и форме глаз — это то, что видно только вживую.";

  el.pbar.style.width = "100%";
  show("result");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* --- Обработчики --- */
document.getElementById("start").addEventListener("click", function(){
  answers = {}; step = 0;
  track("quiz_started");
  show("quiz"); renderQuestion();
});
document.getElementById("back").addEventListener("click", function(){
  if(step>0){ step--; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
});
document.getElementById("restart").addEventListener("click", function(){
  answers={}; step=0; track("quiz_restarted"); show("intro"); window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("again").addEventListener("click", function(){
  answers={}; step=0; track("quiz_restarted"); show("intro"); window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("book").addEventListener("click", function(){ track("quiz_booking_clicked"); });
document.getElementById("ask").addEventListener("click", function(){ track("quiz_contact_clicked"); });

track("quiz_view");

/* Доступ к статистике для владельца: в консоли браузера набрать bsQuizStats() */
window.bsQuizStats = function(){
  var log = JSON.parse(localStorage.getItem("bs_quiz_events")||"[]");
  var counts = {};
  log.forEach(function(x){ counts[x.e]=(counts[x.e]||0)+1; });
  console.table(counts);
  return counts;
};
})();
</script>
